name: CI

# Run the workflow when changes are pushed to the main branch.
on:
  push:
    branches: [main]

# Define the build and test job on an Ubuntu runner.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Download the repository contents onto the runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # Install Node.js and enable npm dependency caching.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Install the exact dependencies listed in the lockfile.
      - name: Install dependencies
        run: npm ci

      # Verify that the project tests pass.
      - name: Run tests
        run: npm test

      # Generate the production build in the dist/ directory.
      - name: Build project
        run: npm run build

      # Save the generated build so it can be downloaded from the workflow run.
      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
